# Test programs. Separate workspace: built with cargo build-sbf (see build.sh).
[workspace]
resolver = "2"
members = ["native-basic", "native-cpi", "anchor-basic"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

# The programs are built for target_os = "solana", which the host rustc does not know about.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
